name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Fix file permissions
        run: |
          chmod -R +x .
          find . -name "*.sh" -exec chmod +x {} +
          chmod +x usymtool usymtoolarm64 lzma process_symbols.sh 2>/dev/null || true

      - name: Build Unity iOS Project
        run: |
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y DragonBoy.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonBoy-IPA
          path: build/DragonBoy.ipa
          if-no-files-found: error